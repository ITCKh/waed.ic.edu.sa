<meta charset="utf-8">

<title>waed</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--text:#1a1a1a;--muted:#6b7280;--box:#fff8e3;--boxb:#f0d98a;--boxt:#8a6d00;--grid:#eef1f7;--blue:#3f73f9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;color:var(--text)}
.wrap{display:grid;grid-template-columns:minmax(260px,28%) 1fr;min-height:100vh;direction:ltr}
.side{background:var(--blue);position:relative;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.side img{width:100%;height:auto;display:block}
.main{direction:rtl;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:60px 60px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px}
.card{width:100%;max-width:340px;text-align:center}
.logo{max-width:280px;width:100%;height:auto;margin-bottom:40px}
h1{font-size:28px;font-weight:700;margin:0 0 14px}
.sub{color:var(--muted);font-size:15px;line-height:1.9;margin-bottom:26px}
.notice{background:var(--box);border:1px solid var(--boxb);color:var(--boxt);border-radius:10px;padding:18px 20px;font-size:15px;line-height:1.9;width:100%}
@media (max-width:760px){.wrap{grid-template-columns:1fr}.side{display:none}}
</style>
